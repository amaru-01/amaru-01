[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # These two values are public identifiers (not secrets); "production" also appears in docs/config.
  # Never add a real token (e.g. SANITY_READ_TOKEN) to this list.
  SECRETS_SCAN_OMIT_KEYS = "SANITY_DATASET,SANITY_PROJECT_ID"
