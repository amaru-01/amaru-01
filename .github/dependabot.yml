version: 2

# Weekly dependency updates. Minor and patch bumps are grouped into one PR per
# folder so the inbox stays quiet; Portfolio CI tests each PR before merge.
updates:
  - package-ecosystem: npm
    directory: /portfolio
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Nairobi
    open-pull-requests-limit: 5
    groups:
      portfolio-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /portfolio/studio
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Nairobi
    open-pull-requests-limit: 3
    groups:
      studio-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Africa/Nairobi
    groups:
      actions:
        patterns: ["*"]
