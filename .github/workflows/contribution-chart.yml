name: Update contribution activity chart

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"
      timezone: "Africa/Nairobi"

permissions:
  contents: write

# Never let a manual run and the scheduled run push at the same time.
concurrency:
  group: contribution-chart
  cancel-in-progress: false

jobs:
  update-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate all-time public contribution chart
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHART_TIMEZONE: Africa/Nairobi
        run: python scripts/generate_contribution_chart.py

      - name: Commit chart if it changed
        run: |
          charts="assets/contribution-activity-dark.svg assets/contribution-activity-light.svg"
          if [ -z "$(git status --porcelain -- $charts)" ]; then
            echo "Contribution chart is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $charts
          git commit -m "Update all-time contribution activity chart"
          # main may have moved while the chart was generated (e.g. a merged PR).
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
