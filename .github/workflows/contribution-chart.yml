name: Update contribution activity chart

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate all-time public contribution chart
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_contribution_chart.py

      - name: Commit chart if it changed
        run: |
          charts="assets/contribution-activity-dark.svg assets/contribution-activity-light.svg"
          if [ -z "$(git status --porcelain -- $charts)" ]; then
            echo "Contribution chart is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $charts
          git commit -m "Update all-time contribution activity chart"
          git push