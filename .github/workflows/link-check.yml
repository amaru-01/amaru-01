name: Weekly link check

# Builds the portfolio and checks every link in the generated pages
# (project demos, source repos, T.C.O.A, social profiles, Sanity images).
# Opens or updates one issue when links break; closes nothing automatically.
on:
  schedule:
    - cron: "0 9 * * 1"
      timezone: "Africa/Nairobi"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: portfolio/.nvmrc
          cache: npm
          cache-dependency-path: portfolio/package-lock.json

      - name: Build the site
        working-directory: portfolio
        env:
          SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ vars.SANITY_DATASET }}
        run: |
          npm ci
          npm run build

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # LinkedIn blocks automated requests (status 999), so it is skipped;
          # mailto links are not fetched.
          args: >-
            --root-dir ${{ github.workspace }}/portfolio/dist
            --exclude 'linkedin\.com'
            --exclude '^mailto:'
            --accept '200..=299,403,429'
            --max-retries 2
            --no-progress
            'portfolio/dist/**/*.html'
          output: lychee/report.md
          fail: false

      - name: Open or update the broken-links issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Broken links on the portfolio"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file lychee/report.md
          else
            gh issue create --title "$title" --body-file lychee/report.md
          fi
