<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
  <title id="title">Amaru's tech stack across projects</title>
  <desc id="desc">A dashboard grouping programming languages, frameworks, AI and data technologies, databases, and development tools used across public, private, and collaborative projects. It does not disclose private project details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a31"/>
      <stop offset="1" stop-color="#17142e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1000" height="590" rx="28" fill="url(#bg)"/>
  <circle cx="890" cy="65" r="150" fill="#8b5cf6" opacity=".09"/>
  <circle cx="80" cy="540" r="180" fill="#06b6d4" opacity=".07"/>
  <text x="52" y="61" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Tech stack</text>
  <text x="52" y="88" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">A cross-project snapshot of languages, frameworks, and tools</text>
  <rect x="52" y="110" width="896" height="2" rx="1" fill="url(#accent)" opacity=".8"/>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="52" y="134" width="432" height="132" rx="18" fill="#ffffff" fill-opacity=".055" stroke="#cbd5e1" stroke-opacity=".18"/>
    <text x="76" y="166" fill="#a5f3fc" font-size="14" font-weight="700">LANGUAGES</text>
    <text x="76" y="201" fill="#e2e8f0" font-size="15">Python · TypeScript · JavaScript · Dart</text>
    <text x="76" y="228" fill="#e2e8f0" font-size="15">C# · C · Kotlin · GDScript · HTML/CSS</text>

    <rect x="516" y="134" width="432" height="132" rx="18" fill="#ffffff" fill-opacity=".055" stroke="#cbd5e1" stroke-opacity=".18"/>
    <text x="540" y="166" fill="#c4b5fd" font-size="14" font-weight="700">WEB, MOBILE &amp; GAMES</text>
    <text x="540" y="201" fill="#e2e8f0" font-size="15">React · Next.js · Flutter · Node.js</text>
    <text x="540" y="228" fill="#e2e8f0" font-size="15">FastAPI · Django · Laravel · Godot</text>

    <rect x="52" y="284" width="432" height="132" rx="18" fill="#ffffff" fill-opacity=".055" stroke="#cbd5e1" stroke-opacity=".18"/>
    <text x="76" y="316" fill="#a5f3fc" font-size="14" font-weight="700">AI &amp; DATA</text>
    <text x="76" y="351" fill="#e2e8f0" font-size="15">Machine learning · XGBoost · scikit-learn</text>
    <text x="76" y="378" fill="#e2e8f0" font-size="15">pandas · OCR · Computer vision</text>

    <rect x="516" y="284" width="432" height="132" rx="18" fill="#ffffff" fill-opacity=".055" stroke="#cbd5e1" stroke-opacity=".18"/>
    <text x="540" y="316" fill="#c4b5fd" font-size="14" font-weight="700">DATA &amp; DEVELOPMENT TOOLS</text>
    <text x="540" y="351" fill="#e2e8f0" font-size="15">PostgreSQL · Firebase · Docker</text>
    <text x="540" y="378" fill="#e2e8f0" font-size="15">GitHub Actions · pytest · Playwright</text>
  </g>

  <text x="52" y="470" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Built across projects</text>
  <text x="52" y="499" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">A broad mix of software engineering, mobile development, AI, and data work.</text>
  <text x="52" y="540" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Technology summary includes public, private, and collaborative work; private project details are not shown.</text>
</svg>
