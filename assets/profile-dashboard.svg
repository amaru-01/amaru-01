<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
  <title id="title">Amaru's tech stack and GitHub repository insights</title>
  <desc id="desc">Dark gradient dashboard with glass-style tech stack panels and a bar chart of primary languages across 18 public repositories with language metadata.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a31"/>
      <stop offset="1" stop-color="#17142e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1000" height="590" rx="28" fill="url(#bg)"/>
  <circle cx="890" cy="65" r="150" fill="#8b5cf6" opacity=".09"/>
  <circle cx="80" cy="540" r="180" fill="#06b6d4" opacity=".07"/>
  <text x="52" y="61" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Tech stack</text>
  <text x="52" y="88" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Tools and technologies across my projects</text>
  <rect x="52" y="110" width="896" height="2" rx="1" fill="url(#accent)" opacity=".8"/>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="52" y="134" width="432" height="132" rx="18" fill="#ffffff" fill-opacity=".055" stroke="#cbd5e1" stroke-opacity=".18"/>
    <text x="76" y="166" fill="#a5f3fc" font-size="14" font-weight="700">LANGUAGES</text>
    <text x="76" y="203" fill="#e2e8f0" font-size="16">Python  ·  TypeScript  ·  JavaScript</text>
    <text x="76" y="232" fill="#e2e8f0" font-size="16">Dart  ·  HTML  ·  CSS  ·  SQL</text>

    <rect x="516" y="134" width="432" height="132" rx="18" fill="#ffffff" fill-opacity=".055" stroke="#cbd5e1" stroke-opacity=".18"/>
    <text x="540" y="166" fill="#c4b5fd" font-size="14" font-weight="700">WEB &amp; MOBILE</text>
    <text x="540" y="203" fill="#e2e8f0" font-size="16">Flutter  ·  React  ·  Next.js</text>
    <text x="540" y="232" fill="#e2e8f0" font-size="16">Node.js  ·  Express  ·  Laravel</text>

    <rect x="52" y="284" width="432" height="132" rx="18" fill="#ffffff" fill-opacity=".055" stroke="#cbd5e1" stroke-opacity=".18"/>
    <text x="76" y="316" fill="#a5f3fc" font-size="14" font-weight="700">AI &amp; DATA</text>
    <text x="76" y="353" fill="#e2e8f0" font-size="16">TensorFlow  ·  PyTorch  ·  OpenCV</text>
    <text x="76" y="382" fill="#e2e8f0" font-size="16">Pandas  ·  NumPy  ·  Power BI</text>

    <rect x="516" y="284" width="432" height="132" rx="18" fill="#ffffff" fill-opacity=".055" stroke="#cbd5e1" stroke-opacity=".18"/>
    <text x="540" y="316" fill="#c4b5fd" font-size="14" font-weight="700">DATABASES &amp; TOOLS</text>
    <text x="540" y="353" fill="#e2e8f0" font-size="16">PostgreSQL  ·  Firebase  ·  MongoDB</text>
    <text x="540" y="382" fill="#e2e8f0" font-size="16">Git  ·  Docker  ·  Linux  ·  Jupyter</text>
  </g>

  <text x="52" y="461" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Repository language snapshot</text>
  <text x="52" y="483" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Primary language by public repository · 18 repositories with language metadata</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#cbd5e1">
    <text x="52" y="513">Python</text><rect x="170" y="500" width="340" height="13" rx="6.5" fill="#1e293b"/><rect x="170" y="500" width="340" height="13" rx="6.5" fill="url(#bar)"/><text x="524" y="512">8 repos</text>
    <text x="52" y="535">HTML</text><rect x="170" y="522" width="340" height="13" rx="6.5" fill="#1e293b"/><rect x="170" y="522" width="212.5" height="13" rx="6.5" fill="url(#bar)"/><text x="524" y="534">5 repos</text>
    <text x="52" y="557">TypeScript</text><rect x="170" y="544" width="340" height="13" rx="6.5" fill="#1e293b"/><rect x="170" y="544" width="85" height="13" rx="6.5" fill="url(#bar)"/><text x="524" y="556">2 repos</text>
    <text x="620" y="513">JavaScript</text><rect x="730" y="500" width="150" height="13" rx="6.5" fill="#1e293b"/><rect x="730" y="500" width="150" height="13" rx="6.5" fill="url(#bar)"/><text x="894" y="512">2</text>
    <text x="620" y="535">CSS</text><rect x="730" y="522" width="150" height="13" rx="6.5" fill="#1e293b"/><rect x="730" y="522" width="75" height="13" rx="6.5" fill="url(#bar)"/><text x="894" y="534">1</text>
  </g>
</svg>
